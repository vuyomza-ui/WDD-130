<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width/initial-scale=1.0">
    <meta name="decription" content="Complete this poll about your contact information, favorite browser, and personal preferences.">
    <meta name="author" content="Vuyo Mkhuzangwe">
    <title>WDD130 | HTML Form</title>
</head>

<body>
    <header>
        <h1>WDD130 HTML Form - Poll</h1>
    </header>
    <main>
        <form>

            <fieldset>
                <legend>Contact Information</legend>

                <label for="fullname">Full Name:</label>
                <input type="text" id="fullname" name="fullname" required>

                <label for="useremail">Email Address:</label>
                <input type="email" id="useremail" name="useremail" required>
            </fieldset>

            <fieldset>
                <legend>Questions</legend>

                <label for="browser">
                    What is your favourite internet browser?
                </label>

                <select id="browser" name="browser">
                    <option value="chrome">Chrome</option>
                    <option value="firefox">Firefox</option>
                    <option value="safari">Safari</option>
                    <option value="edge">Edge</option>
                    <option value="brave">Brave</option>
                    <option value="other">Other</option>
                </select>

                <label for="pet">
                    Do you have a household pet?
                </label>

                <input type="Checkbox" id="pet" name="pet">

                <label for="places">
                    List the places you have lived:
                </label>

                <textarea id="places" name="places" rows="4" placeholder="Johannesburg South Africa, Sidney Canada, Moscow Russia">
                </textarea>
            </fieldset>

            <button type="submit">Submit Poll</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 | WDD130 HTML Form Activity | Vuyo Mkhuzangwe</p>
    </footer>
</body>

</html>
